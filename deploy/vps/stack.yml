# Chatwoot on the VPS (Docker Swarm stack "chatwoot_v2"), deployed by
# .github/workflows/deploy_vps.yml via deploy.sh. Own Postgres, Redis and
# volumes, apart from the legacy "chatwoot" stack.
#
# The public domain goes through the shared Traefik on the "Melck" network. The
# route is off unless the server's .env sets TRAEFIK_ENABLE=true (deploy.sh
# exports it), so merging stack changes never moves the domain by itself.
version: '3.8'

x-chatwoot: &chatwoot
  image: ${CHATWOOT_IMAGE:?CHATWOOT_IMAGE is required}
  env_file: .env
  volumes:
    - storage:/app/storage
  networks:
    - internal

services:
  app:
    <<: *chatwoot
    entrypoint: docker/entrypoints/rails.sh
    command: sh -c "bundle exec rails db:chatwoot_prepare && bundle exec rails s -p 3000 -b 0.0.0.0"
    networks:
      - internal
      - Melck
    ports:
      - target: 3000
        published: ${APP_PORT:-3001}
        mode: ingress
    deploy:
      replicas: ${APP_REPLICAS:-1}
      update_config:
        order: stop-first
        failure_action: pause
      labels:
        - traefik.enable=${TRAEFIK_ENABLE:-false}
        - traefik.swarm.network=Melck
        - traefik.http.routers.chatwoot_v2_app.rule=Host(`${APP_HOST:-app.melck.app}`)
        - traefik.http.routers.chatwoot_v2_app.entrypoints=websecure
        - traefik.http.routers.chatwoot_v2_app.tls.certresolver=letsencryptresolver
        # Above the legacy stack's router (priority 1) while both exist.
        - traefik.http.routers.chatwoot_v2_app.priority=100
        - traefik.http.routers.chatwoot_v2_app.service=chatwoot_v2_app
        - traefik.http.routers.chatwoot_v2_app.middlewares=chatwoot_v2_https_header
        - traefik.http.middlewares.chatwoot_v2_https_header.headers.customrequestheaders.X-Forwarded-Proto=https
        - traefik.http.services.chatwoot_v2_app.loadbalancer.server.port=3000
        - traefik.http.services.chatwoot_v2_app.loadbalancer.passHostHeader=true
      resources:
        limits:
          cpus: '2'
          memory: 2048M

  sidekiq:
    <<: *chatwoot
    command: bundle exec sidekiq -C config/sidekiq.yml
    deploy:
      replicas: ${APP_REPLICAS:-1}
      resources:
        limits:
          cpus: '1'
          memory: 1536M

  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis:/data
    networks:
      - internal

volumes:
  storage:
  postgres:
  redis:

networks:
  internal:
    driver: overlay
    attachable: true
  Melck:
    external: true
